stages:
  - test

test:
  stage: test
  image: golang:latest
  variables:
    GOPATH: ${CI_PROJECT_DIR}/.go
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_DEPTH: 0
    GIT_SUBMODULE_DEPTH: 0
  cache:
    key: go-cache-${CI_PROJECT_PATH_SLUG}
    paths:
      - .go
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"
  before_script:
    - mkdir -p .go
  script:
    - go mod tidy -v
    - go test -v
    - go build -v
